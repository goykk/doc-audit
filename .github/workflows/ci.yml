name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root_pwd
          MYSQL_DATABASE: docaudit
          MYSQL_USER: docaudit
          MYSQL_PASSWORD: docaudit_pwd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_pwd"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: docaudit
      MYSQL_USER: docaudit
      MYSQL_PASSWORD: docaudit_pwd
      REQUIRE_DB_TESTS: "1"
      DASHSCOPE_API_KEY: test-key
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Apply schema migrations
        run: |
          for file in infra/mysql/init/*.sql; do
            echo "Applying $file"
            mysql -h127.0.0.1 -uroot -proot_pwd docaudit < "$file"
          done

      - name: Run tests
        run: pytest -q
